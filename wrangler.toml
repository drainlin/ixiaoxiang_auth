name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2026-03-10"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "auth-worker"
database_id = "b11d60cf-c3ad-42a7-bbab-d7cf0ebf49a0"

[[kv_namespaces]]
binding = "OTP_KV"
id = "bbc69d76ceb44d63810c920ad3896fda"

[[services]]
binding = "MAIL_GATEWAY"
service = "mail-gateway"

[vars]
APP_NAME = "CineDock"
DEFAULT_APP_ID = "cinedock"
APP_BUNDLE_ID = "cn.ixiaoxiang.video"
DEFAULT_APP_NAME = "CineDock"
DEFAULT_APP_ORIGIN = "https://ixiaoxiang.cn"
DEFAULT_APP_BUNDLE_ID = "cn.ixiaoxiang.video"
ACCESS_TOKEN_TTL_SECONDS = "86400"
REFRESH_TOKEN_TTL_SECONDS = "1209600"
OTP_TTL_SECONDS = "300"
OTP_MAX_ATTEMPTS = "5"
PASSKEY_RP_NAME = "CineDock"
PASSKEY_CHALLENGE_TTL_SECONDS = "300"
PASSKEY_RP_ID = "ixiaoxiang.cn"
PASSKEY_EXPECTED_ORIGINS = "https://ixiaoxiang.cn,https://music.ixiaoxiang.cn"
APP_EMAIL_SUBJECTS = "{\"cinedock\":\"{app_name} Login Code\",\"echospace\":\"{app_name} Login Code\"}"
APP_CONFIGS = "{\"cinedock\":{\"appName\":\"CineDock\",\"appOrigin\":\"https://ixiaoxiang.cn\",\"appBundleId\":\"cn.ixiaoxiang.video\",\"passkeyRpId\":\"ixiaoxiang.cn\",\"passkeyRpName\":\"CineDock\",\"passkeyExpectedOrigins\":[\"https://ixiaoxiang.cn\"]},\"echospace\":{\"appName\":\"EchoSpace\",\"appOrigin\":\"https://ixiaoxiang.cn\",\"appBundleId\":\"cn.ixiaoxiang.music\",\"passkeyRpId\":\"ixiaoxiang.cn\",\"passkeyRpName\":\"EchoSpace\",\"passkeyExpectedOrigins\":[\"https://ixiaoxiang.cn\"]}}"

# Required for passkeys:
# - Ensure apple-app-site-association / assetlinks.json are also configured for this domain

# Secrets you must set with wrangler secret put:
# - JWT_SECRET
# - MAIL_GATEWAY_SIGNING_SECRET
# Optional:
# - MAIL_GATEWAY_TOKEN
