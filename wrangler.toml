name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2026-03-10"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "auth-worker"
database_id = "b11d60cf-c3ad-42a7-bbab-d7cf0ebf49a0"

[[kv_namespaces]]
binding = "OTP_KV"
id = "bbc69d76ceb44d63810c920ad3896fda"

[[services]]
binding = "MAIL_GATEWAY"
service = "mail-gateway"

[vars]
APP_NAME = "Auth Service"
DEFAULT_APP_ID = "default"
APP_BUNDLE_ID = "com.example.auth"
DEFAULT_APP_NAME = "Auth Service"
DEFAULT_APP_ORIGIN = "https://auth.example.com"
DEFAULT_APP_BUNDLE_ID = "com.example.auth"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
OTP_TTL_SECONDS = "300"
OTP_MAX_ATTEMPTS = "5"
PASSKEY_RP_NAME = "Auth Service"
PASSKEY_CHALLENGE_TTL_SECONDS = "300"
PASSKEY_RP_ID = "auth.example.com"
PASSKEY_EXPECTED_ORIGINS = "https://auth.example.com"
APP_EMAIL_SUBJECTS = "{\"app1\":\"{app_name} Login Code\",\"app2\":\"{app_name} Login Code\"}"
APP_CONFIGS = "{\"app1\":{\"appName\":\"App One\",\"appOrigin\":\"https://app1.example.com\",\"appBundleId\":\"com.example.app1\",\"passkeyRpId\":\"auth.example.com\",\"passkeyRpName\":\"App One\",\"passkeyExpectedOrigins\":[\"https://app1.example.com\"]},\"app2\":{\"appName\":\"App Two\",\"appOrigin\":\"https://app2.example.com\",\"appBundleId\":\"com.example.app2\",\"passkeyRpId\":\"auth.example.com\",\"passkeyRpName\":\"App Two\",\"passkeyExpectedOrigins\":[\"https://app2.example.com\"]}}"

# Required for passkeys:
# - Ensure apple-app-site-association / assetlinks.json are also configured for this domain

# Secrets you must set with wrangler secret put:
# - JWT_SECRET
# - MAIL_GATEWAY_SIGNING_SECRET
# Optional:
# - MAIL_GATEWAY_TOKEN
